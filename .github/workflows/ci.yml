name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

env:
  JAVA_DISTRIBUTION: corretto
  JAVA_VERSION: 21

jobs:
  # Runs the Gradle build for this project.
  # See: https://github.com/gradle/actions/tree/main/setup-gradle
  gradle-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle Wrapper
        run: ./gradlew build --no-daemon

  # Generates and submits a dependency graph, enabling Dependabot Alerts.
  # See: https://github.com/gradle/actions/tree/main/dependency-submission
  gradle-dependency-submission:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
